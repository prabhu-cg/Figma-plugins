name: DSLog CI

on:
  push:
    branches: [main]
    paths:
      - "DSLog/**"
      - ".github/workflows/dslog-ci.yml"
  pull_request:
    paths:
      - "DSLog/**"
      - ".github/workflows/dslog-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DSLog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: DSLog/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # dist/ is committed (loaded on machines that can't run npm), so it must match src/.
      - name: Check dist/ is up to date
        run: git diff --exit-code -- dist
