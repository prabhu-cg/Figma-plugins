    <script>
      // Apply the theme before first paint so a dark Figma doesn't flash light. Mirrors useTheme's
      // resolution: stored choice, else Figma's figma-dark/figma-light class, else the OS setting.
      try {
        var root = document.documentElement;
        var stored = localStorage.getItem("designlens-theme");
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            (root.classList.contains("figma-dark") ||
              (!root.classList.contains("figma-light") && matchMedia("(prefers-color-scheme: dark)").matches)));
        root.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
