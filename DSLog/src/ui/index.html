<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSLog</title>
    <script>
      // Resolve the theme before first paint so dark-mode users don't see a light flash.
      (function () {
        var theme = "system";
        try {
          var stored = localStorage.getItem("dslog-theme");
          if (stored === "light" || stored === "dark") theme = stored;
        } catch (e) {}
        var dark = theme === "dark" || (theme === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
